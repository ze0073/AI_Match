version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aimatch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: aimatch
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: aimatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build: .
    container_name: aimatch-server
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/aimatch?useUnicode=true&characterEncoding=utf8mb4
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
  redis_data:
